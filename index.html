<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4efe6" />
  <meta name="description" content="Find a scholarship, check it, email family if you want a review. Data stays on this device." />
  <title>ScholarSafe 1.1.0</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="lock" class="lock hidden">
    <div class="card" style="width:min(420px,100%)">
      <h1>ScholarSafe</h1>
      <p class="muted">Enter the PIN for this device.</p>
      <label for="pinIn">PIN</label>
      <input id="pinIn" type="password" inputmode="numeric" autocomplete="off" />
      <p id="pinErr" class="small" style="color:var(--danger)"></p>
      <div class="row">
        <button class="primary" id="pinGo" type="button">Unlock</button>
        <button class="danger" id="pinWipe" type="button">Forgot PIN — erase this copy</button>
      </div>
    </div>
  </div>

  <div id="app" class="app">
    <header class="top">
      <div class="brand">
        <h1>ScholarSafe</h1>
        <span class="ver" id="verLabel">v1.1.0</span>
      </div>
      <nav class="nav" aria-label="Main">
        <button data-view="home" aria-current="page">Home</button>
        <button data-view="sources">Find</button>
        <button data-view="check">Check</button>
        <button data-view="history">List</button>
        <button data-view="menu">Menu</button>
      </nav>
    </header>

    <div id="updateBanner" class="banner hidden"></div>
    <div id="backupBanner" class="banner warn hidden"></div>

    <main id="view-home"></main>
    <main id="view-sources" class="hidden"></main>
    <main id="view-check" class="hidden"></main>
    <main id="view-history" class="hidden"></main>
    <main id="view-menu" class="hidden"></main>
    <p class="footer-note">Find one. Check it. Apply on the official site. Email family only if you want a review.</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
